<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Hierarchy - Solar Twin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Leaflet CSS for Real Geo-Location Maps -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --sidebar-w:256px;--topbar-h:52px;--detail-w:320px;
  --accent:#1a7f55;--accent-lt:#e6f4ee;
  --ok:#16a34a;--ok-lt:#dcfce7;
  --warn:#ca8a04;--warn-lt:#fef9c3;
  --fault:#dc2626;--fault-lt:#fee2e2;
  --blue:#1d4ed8;--blue-lt:#eff6ff;
  --purple:#7c3aed;--purple-lt:#ede9fe;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;font-size:13px;background:#f1f5f9;overflow:hidden;color:#1e293b}
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr var(--detail-w);grid-template-rows:var(--topbar-h) 1fr;height:100vh}
.shell.map-view{grid-template-columns:var(--sidebar-w) 1fr}
.shell.map-view .main{grid-column:2;grid-row:2;overflow:hidden}
.shell.map-view .detail{display:none}
.shell.map-view .main-inner{padding:0;height:100%;overflow:hidden}

/* TOPBAR */
.topbar{grid-column:1/-1;display:flex;align-items:center;background:#fff;border-bottom:1px solid #e2e8f0;z-index:200}
.topbar-brand{display:flex;align-items:center;justify-content:center;padding:0 18px;border-right:1px solid #e2e8f0;height:100%;min-width:var(--sidebar-w)}
.brand-logo{height:40px;object-fit:contain;transition:opacity .2s}
.brand-logo:hover{opacity:.85}
.topbar-plant{display:flex;align-items:center;gap:12px;padding:0 20px;border-right:1px solid #e2e8f0;height:100%}
.plant-label{font-size:10px;color:#94a3b8;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.plant-select{border:none;background:transparent;font-size:14px;font-weight:600;color:#0f172a;font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.topbar-kpis{display:flex;align-items:center;margin-left:auto}
.kpi-chip{padding:0 18px;border-left:1px solid #e2e8f0;height:var(--topbar-h);display:flex;flex-direction:column;justify-content:center;text-align:right}
.kpi-v{font-size:14px;font-weight:700;color:#0f172a}
.kpi-l{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.live-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--accent);background:var(--accent-lt);border:1px solid #a7f3d0;border-radius:20px;padding:3px 10px;margin:0 16px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.5s ease-in-out infinite}
.map-view-toggle{display:flex;align-items:center;gap:6px;padding:6px 14px;margin:0 8px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:12px;font-weight:500;color:#64748b;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.map-view-toggle:hover{background:#f8fafc;border-color:#cbd5e1}
.map-view-toggle.active{background:#e6f4ee;border-color:#a7f3d0;color:#1a7f55}
.map-view-toggle svg{width:16px;height:16px;flex-shrink:0}

/* SIDEBAR */
.sidebar{background:#fff;border-right:1px solid #e2e8f0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:#e2e8f0}
.sb-head{padding:12px 14px 4px;font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;flex-shrink:0}
.tree-row{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;transition:background .1s;position:relative;user-select:none}
.tree-row:hover{background:#f8fafc}
.tree-row.active{background:#e6f4ee}
.tree-row.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 2px 2px 0}
.tree-toggle{width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:11px;flex-shrink:0;transition:transform .18s}
.tree-toggle.open{transform:rotate(90deg)}
.tree-toggle.leaf{opacity:0;pointer-events:none}
.tree-icon{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tree-icon svg{width:13px;height:13px}
.tree-label{font-size:12px;color:#1e293b;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-status{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* ── TOOLTIP ── */
.tree-row{position:relative}
.tree-row .tt{
  display:none;
  position:fixed;
  /* JS will set left/top dynamically */
  background:#1e293b;color:#f8fafc;font-size:11px;padding:8px 11px;border-radius:8px;
  white-space:nowrap;z-index:9999;pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.22);
  min-width:170px;line-height:1.6;
  transform:translateY(-50%);
}
.tree-row .tt::before{
  content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-right-color:#1e293b
}
.tree-row:hover .tt{display:block}
.status-ok{background:var(--ok)}
.status-warn{background:var(--warn)}
.status-fault{background:var(--fault)}
.tree-add{width:14px;height:14px;display:flex;align-items:center;justify-content:center;color:#cbd5e1;flex-shrink:0;border-radius:3px;transition:background .1s,color .1s}
.tree-add:hover{background:#dcfce7;color:var(--accent)}
.tree-add svg{width:10px;height:10px}
.tree-children{display:none}
.tree-children.open{display:block}
.bg-plant{background:#dcfce7;color:#085041}
.bg-dno{background:#dbeafe;color:#0c447c}
.bg-css{background:#ede9fe;color:#3c3489}
.bg-swg{background:#fef3c7;color:#633806}
.bg-tx{background:#fee2e2;color:#712b13}
.bg-inv{background:#f3e8ff;color:#6b21a8}
.bg-scb{background:#fefce8;color:#a16207}
.bg-str{background:#f0fdf4;color:#274f0a}
.bg-panel{background:#f0fdf4;color:#14532d}

/* MAIN */
.main{overflow-y:auto;background:#f1f5f9;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:#cbd5e1}
.main-inner{padding:20px 22px;flex:1}
.bc{font-size:11px;margin-bottom:14px}
.bc a{color:var(--accent);text-decoration:none;cursor:pointer}
.bc a:hover{text-decoration:underline}
.page-title{font-size:20px;font-weight:700;color:#0f172a;line-height:1.2}
.page-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;border:1px solid}
.tag-ok{background:var(--ok-lt);color:var(--ok);border-color:#86efac}
.tag-warn{background:var(--warn-lt);color:var(--warn);border-color:#fde047}
.tag-fault{background:var(--fault-lt);color:var(--fault);border-color:#fca5a5}
.tag-info{background:var(--blue-lt);color:var(--blue);border-color:#bfdbfe}
.tag-level{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
.tag-serial{background:#ede9fe;color:var(--purple);border-color:#c4b5fd;font-family:monospace;letter-spacing:.02em}
.tag-no-serial{background:#fff7ed;color:#c2410c;border-color:#fed7aa}

/* serial number inline edit */
.sn-box{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px 12px;margin-bottom:14px}
.sn-box svg{width:14px;height:14px;flex-shrink:0;color:#7c3aed}
.sn-label{font-size:10px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.sn-val{font-size:12px;font-weight:600;color:#0f172a;font-family:monospace;flex:1}
.sn-missing{font-size:12px;color:#c2410c;font-style:italic;flex:1}
.sn-edit-btn{font-size:10px;padding:2px 8px;border-radius:6px;border:1px solid #e2e8f0;background:#fff;color:#64748b;cursor:pointer;white-space:nowrap}
.sn-edit-btn:hover{background:#f1f5f9;border-color:#cbd5e1}

/* fault banner */
.fault-banner{border-radius:10px;padding:10px 14px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.fault-banner svg{flex-shrink:0;width:16px;height:16px;margin-top:1px}
.fb-fault{background:#fff5f5;border:1px solid #fca5a5}
.fb-warn{background:#fefce8;border:1px solid #fde047}

/* kpi cards */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px;position:relative;overflow:hidden}
.kpi-card .bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:10px 10px 0 0}
.kpi-val{font-size:21px;font-weight:700;color:#0f172a;margin:4px 0 2px}
.kpi-lbl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.kpi-delta{font-size:11px;margin-top:5px}
.sec{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.07em;padding-bottom:6px;border-bottom:1px solid #e2e8f0;margin-bottom:12px}

/* children grid */
.child-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.child-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:13px;cursor:pointer;transition:box-shadow .15s,transform .15s}
.child-card:hover{box-shadow:0 3px 14px rgba(0,0,0,.08);transform:translateY(-1px)}
.child-card.is-fault{border-color:#fca5a5;background:#fff5f5}
.child-card.is-warn{border-color:#fde047}
.child-lbar{height:3px;border-radius:2px;margin-bottom:10px}
.child-name{font-size:13px;font-weight:600;color:#0f172a}
.child-sn{font-size:10px;color:#7c3aed;font-family:monospace;margin-bottom:2px}
.child-sub{font-size:11px;color:#94a3b8;margin-bottom:8px}
.child-stats{display:flex;gap:8px;flex-wrap:wrap}
.child-stat{font-size:11px;color:#475569;display:flex;align-items:center;gap:4px}
.child-stat-dot{width:6px;height:6px;border-radius:50%}
.add-child-card{background:#f8fafc;border:1.5px dashed #cbd5e1;border-radius:10px;padding:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:border-color .15s,background .15s;min-height:100px}
.add-child-card:hover{border-color:var(--accent);background:var(--accent-lt)}
.add-child-card svg{width:20px;height:20px;color:#94a3b8;transition:color .15s}
.add-child-card:hover svg{color:var(--accent)}
.add-child-card span{font-size:12px;color:#94a3b8;font-weight:500;transition:color .15s}
.add-child-card:hover span{color:var(--accent)}

/* tabs */
.tab-nav{display:flex;gap:4px;background:#fff;border-radius:8px;padding:4px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.tab-btn{flex:1;text-align:center;padding:8px 12px;font-size:11px;font-weight:500;color:#64748b;border:none;background:transparent;border-radius:6px;cursor:pointer;transition:background .15s,color .15s}
.tab-btn:hover{background:#f8fafc;color:#475569}
.tab-btn.active{background:var(--accent);color:#fff;box-shadow:0 2px 4px rgba(26,127,85,.2)}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* sparkline */
.spark-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:14px}
.spark-title{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em}
.spark-val{font-size:18px;font-weight:700;color:#0f172a;margin:2px 0 8px}
.spark-unit{font-size:11px;color:#94a3b8}
.spark-svg{width:100%;display:block;overflow:visible}

/* activity */
.act-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;transition:background .1s}
.act-item:hover{background:#f8fafc}
.act-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.act-icon svg{width:14px;height:14px}
.act-body{flex:1}
.act-text{font-size:12px;color:#334155}
.act-text strong{color:#0f172a}
.act-meta{font-size:10px;color:#94a3b8;margin-top:2px}

/* maintenance */
.maint-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9;align-items:flex-start}
.maint-row:last-child{border-bottom:none}
.maint-date{font-size:11px;color:#64748b;width:76px;flex-shrink:0}
.maint-body{flex:1}
.maint-title{font-size:12px;font-weight:500;color:#0f172a}
.maint-sub{font-size:11px;color:#94a3b8}
.maint-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:500;white-space:nowrap}

/* replace history */
.repl-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9;align-items:flex-start}
.repl-row:last-child{border-bottom:none}
.repl-dot{width:9px;height:9px;border-radius:50%;border:2px solid;flex-shrink:0;margin-top:3px}
.repl-body{flex:1}
.repl-title{font-size:12px;font-weight:500;color:#0f172a}
.repl-sub{font-size:11px;color:#94a3b8}

/* DETAIL */
.detail{background:#fff;border-left:1px solid #e2e8f0;overflow-y:auto;display:flex;flex-direction:column}
.detail::-webkit-scrollbar{width:3px}
.detail::-webkit-scrollbar-thumb{background:#e2e8f0}
.detail-hdr{padding:14px 16px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:5}
.detail-title{font-size:14px;font-weight:700;color:#0f172a}
.detail-sub{font-size:11px;color:#94a3b8}
.detail-body{padding:14px 16px;flex:1}
.d-sec{font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px}
.d-sec:first-child{margin-top:0}
.d-kv{display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid #f8fafc;font-size:12px}
.d-kv:last-child{border-bottom:none}
.d-k{color:#64748b}
.d-v{color:#0f172a;font-weight:500;text-align:right;max-width:58%}

/* ── HIERARCHY DIAGRAM ── */
.hier-diagram{width:100%;overflow-x:auto;padding:4px 0 8px}
.hd-track{display:flex;flex-direction:column;gap:0;position:relative}
.hd-node{display:flex;align-items:center;gap:0;position:relative}
.hd-connector{display:flex;flex-direction:column;align-items:center;width:20px;flex-shrink:0}
.hd-connector-v{width:1px;height:10px;background:#e2e8f0}
.hd-connector-h{display:flex;align-items:center;gap:0;width:20px}
.hd-h-line{width:10px;height:1px;background:#e2e8f0}
.hd-chip{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;cursor:default;transition:border-color .15s;margin:2px 0;flex:1}
.hd-chip.hd-cur{border-width:2px}
.hd-chip-icon{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hd-chip-icon svg{width:10px;height:10px}
.hd-chip-body{min-width:0}
.hd-chip-label{font-size:11px;font-weight:600;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-chip-level{font-size:9px;color:#94a3b8;white-space:nowrap}
.hd-chip-sn{font-size:9px;color:#7c3aed;font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-vwrap{display:flex;flex-direction:column;align-items:center}
.hd-vline{width:1px;flex:1;min-height:8px;background:#e2e8f0}
.hd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── MAP TAB ── */
.map-wrap{position:relative;background:#f0f4f0;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;user-select:none;height:600px}
#real-map{width:100%;height:100%;border-radius:10px}
.leaflet-container{font-family:'Inter',sans-serif}
.custom-marker{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .2s}
.custom-marker:hover{transform:scale(1.2);z-index:1000}
.marker-ok{background:#16a34a}
.marker-warn{background:#ca8a04}
.marker-fault{background:#dc2626}
.map-layer-btn{padding:6px 12px;margin:2px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font-size:11px;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.map-layer-btn:hover{background:#f8fafc;border-color:#cbd5e1}
.map-layer-btn.active{background:#e6f4ee;border-color:#a7f3d0;color:#1a7f55;font-weight:500}
.geo-map-stats{position:absolute;bottom:10px;left:10px;z-index:1000;background:rgba(255,255,255,0.96);border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);font-size:11px;backdrop-filter:blur(6px)}
.geo-map-stats-title{font-weight:600;color:#0f172a;margin-bottom:6px}
.geo-map-stat-row{display:flex;align-items:center;gap:6px;margin:3px 0}
.geo-map-stat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.leaflet-popup-content-wrapper{border-radius:8px;padding:0}
.leaflet-popup-content{margin:0;min-width:200px}
.geo-popup{padding:12px}
.geo-popup-title{font-weight:600;font-size:14px;color:#0f172a;margin-bottom:4px}
.geo-popup-sub{font-size:11px;color:#64748b;margin-bottom:8px}
.geo-popup-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #f1f5f9}
.geo-popup-row:last-child{border-bottom:none}
.geo-popup-k{color:#64748b}
.geo-popup-v{color:#0f172a;font-weight:500}
.geo-popup-btn{width:100%;margin-top:8px;padding:6px;border:1px solid #a7f3d0;border-radius:6px;background:#e6f4ee;font-size:11px;cursor:pointer;color:#1a7f55;font-weight:500;text-align:center}
.geo-popup-btn:hover{background:#d1fae5}
.map-info-close{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#94a3b8;font-size:16px;transition:all .15s}
.map-info-close:hover{background:#f1f5f9;color:#64748b}
.map-info-title{font-weight:600;color:#0f172a;margin-bottom:2px}
.map-info-sub{font-size:10px;color:#94a3b8;margin-bottom:6px}
.map-info-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px solid #f1f5f9}
.map-info-row:last-child{border:none}
.map-info-k{color:#64748b}
.map-info-v{color:#0f172a;font-weight:500}
/* no-geo state */
.map-no-geo{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:#94a3b8;gap:8px}
.map-no-geo svg{width:36px;height:36px;opacity:.4}
/* map geofence marker */
.map-geofence{stroke:#1d4ed8;stroke-width:1.5;stroke-dasharray:6,3;fill:#1d4ed8;fill-opacity:.04}
/* zoom controls - moved to bottom right */
.map-zoom{position:absolute;bottom:10px;right:10px;display:flex;flex-direction:column;gap:3px}
.map-zoom-btn{width:32px;height:32px;background:rgba(255,255,255,.96);border:1px solid #e2e8f0;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;font-weight:600;color:#475569;transition:all .15s;backdrop-filter:blur(6px);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.map-zoom-btn:hover{background:#fff;border-color:#cbd5e1;transform:scale(1.05)}
.map-zoom-btn:active{transform:scale(.95)}
/* history combined tab */
.hist-section-head{font-size:11px;font-weight:600;color:#0f172a;margin:14px 0 8px;padding-bottom:6px;border-bottom:2px solid #e2e8f0;display:flex;align-items:center;gap:6px}
.hist-section-head svg{width:13px;height:13px}

/* unified history row */
.hist-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f1f5f9;align-items:flex-start}
.hist-row:last-child{border-bottom:none}
.hist-date{font-size:11px;color:#64748b;width:76px;flex-shrink:0}
.hist-body{flex:1}
.hist-title{font-size:12px;font-weight:500;color:#0f172a}
.hist-sub{font-size:11px;color:#94a3b8}
.hist-badge{font-size:10px;padding:3px 9px;border-radius:12px;font-weight:500;white-space:nowrap;flex-shrink:0}

/* pagination */
.hist-pagination{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid #e2e8f0}
.hist-page-info{font-size:11px;color:#64748b}
.hist-page-btns{display:flex;gap:4px}
.hist-page-btn{padding:4px 10px;font-size:11px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;color:#475569;cursor:pointer;transition:background .1s,border-color .1s;font-weight:500}
.hist-page-btn:hover:not(:disabled){background:#f8fafc;border-color:#cbd5e1}
.hist-page-btn:disabled{opacity:.4;cursor:not-allowed}
.hist-page-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.act-group{margin-bottom:10px}
.act-group-label{font-size:9px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.act-row{display:flex;gap:5px;margin-bottom:0}
.act-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border-radius:8px;border:1px solid #e2e8f0;background:#fff;font-size:11px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s;color:#334155;text-align:center;white-space:nowrap}
.act-btn:hover{background:#f8fafc;border-color:#cbd5e1}
.act-btn svg{width:13px;height:13px;flex-shrink:0}
.act-btn.full{flex:unset;width:100%;justify-content:flex-start;padding:8px 10px;margin-bottom:5px;font-size:12px}
.act-btn.primary{background:#e6f4ee;border-color:#a7f3d0;color:var(--accent)}
.act-btn.primary:hover{background:#d1fae5}
.act-btn.add{background:#ede9fe;border-color:#c4b5fd;color:#6d28d9}
.act-btn.add:hover{background:#ddd6fe}
.act-btn.warn{background:#fef9c3;border-color:#fde047;color:var(--warn)}
.act-btn.warn:hover{background:#fef08a}
.act-btn.danger{background:#fee2e2;border-color:#fca5a5;color:var(--fault)}
.act-btn.danger:hover{background:#fecaca}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:24px;width:460px;max-width:95vw;box-shadow:0 20px 60px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.modal-box::-webkit-scrollbar{width:3px}
.modal-box::-webkit-scrollbar-thumb{background:#e2e8f0}
.modal-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.modal-icon svg{width:18px;height:18px}
.modal-title{font-size:16px;font-weight:700;color:#0f172a;margin-bottom:4px}
.modal-sub{font-size:12px;color:#64748b;margin-bottom:18px;line-height:1.5}
.mf{margin-bottom:12px}
.mf label{display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
.mf input,.mf select,.mf textarea{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:'Inter',sans-serif;color:#0f172a;outline:none;transition:border-color .15s;background:#fff}
.mf input:focus,.mf select:focus,.mf textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(26,127,85,.1)}
.mf .hint{font-size:11px;color:#94a3b8;margin-top:4px}
.mf .sn-required{font-size:11px;color:#c2410c;margin-top:4px;font-weight:500}
/* child type picker */
.child-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.ct-option{border:1.5px solid #e2e8f0;border-radius:8px;padding:10px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px}
.ct-option:hover{border-color:#a7f3d0;background:#f0fdf9}
.ct-option.selected{border-color:var(--accent);background:var(--accent-lt)}
.ct-option .ct-icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ct-option .ct-icon svg{width:14px;height:14px}
.ct-option .ct-name{font-size:12px;font-weight:600;color:#0f172a}
.ct-option .ct-level{font-size:10px;color:#94a3b8}
/* sn step indicator */
.step-row{display:flex;gap:0;margin-bottom:16px}
.step{flex:1;text-align:center;font-size:10px;font-weight:600;padding:6px 4px;border-bottom:2px solid #e2e8f0;color:#94a3b8;transition:all .2s}
.step.active{border-bottom-color:var(--accent);color:var(--accent)}
.step.done{border-bottom-color:#86efac;color:var(--ok)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #f1f5f9}
.mbtn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid;transition:background .12s}
.mbtn-cancel{background:#fff;border-color:#e2e8f0;color:#475569}
.mbtn-cancel:hover{background:#f8fafc}
.mbtn-ok{background:var(--accent);border-color:var(--accent);color:#fff}
.mbtn-ok:hover{background:#166641}
.mbtn-warn{background:#dc2626;border-color:#dc2626;color:#fff}
.mbtn-warn:hover{background:#b91c1c}
.mbtn-purple{background:#7c3aed;border-color:#7c3aed;color:#fff}
.mbtn-purple:hover{background:#6d28d9}

/* TOAST */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 14px;box-shadow:0 4px 20px rgba(0,0,0,.12);font-size:12px;color:#334155;display:flex;align-items:center;gap:8px;min-width:230px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast svg{width:15px;height:15px;flex-shrink:0}
.toast.t-ok{border-left:3px solid var(--ok)}
.toast.t-warn{border-left:3px solid var(--warn)}
.toast.t-fault{border-left:3px solid var(--fault)}
.toast.t-purple{border-left:3px solid var(--purple)}
</style>
</head>

</header>

<!-- SIDEBAR -->

<!-- MAIN -->

  </div>
</main>

<!-- DETAIL -->
<aside class="detail">

  </div>
  <div class="detail-body" id="detail-body">
    <div class="text-center text-muted mt-4" style="font-size:12px">No asset selected</div>
  </div>
</aside>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="maybeCloseModal(event)">
  <div class="modal-box" id="modal-box" onclick="event.stopPropagation()">

    <div class="modal-sub" id="modal-sub"></div>
    <div id="modal-body"></div>

</div>

function switchPlant(id){

// ═══════════════════════════════════════
// TREE
// ═══════════════════════════════════════
function renderTree(){
  const root = document.getElementById('tree-root');
  root.innerHTML = '';
  const tree = PLANTS[currentPlant].tree;
  renderNodes([tree], root, 0);
  updateAssetCount();
}

function renderNodes(nodes, container, depth){
  nodes.forEach(nd => {
    const wrap = document.createElement('div');
    const hasChildren = nd.children && nd.children.length > 0;
    const isExpanded = expanded.has(nd.id);
    const isSelected = selectedId === nd.id;
    const statusCls = nd.status==='fault'?'status-fault':nd.status==='warn'?'status-warn':'status-ok';
    const canAddChild = (CHILD_TYPES[nd.type]||[]).length > 0;

    const row = document.createElement('div');
    row.className = `tree-row${isSelected?' active':''}`;
    row.style.paddingLeft = `${12+depth*14}px`;

    const toggle = document.createElement('div');
    toggle.className = `tree-toggle${hasChildren?(isExpanded?' open':''):' leaf'}`;
    toggle.innerHTML = '&#8250;';

    const icon = document.createElement('div');
    icon.className = `tree-icon ${nd.bg}`;
    icon.innerHTML = I[nd.iconKey]||I.panel;

    const label = document.createElement('div');
    label.className = 'tree-label';
    label.textContent = nd.label;

    const dot = document.createElement('div');
    dot.className = `tree-status ${statusCls}`;

    const addBtn = document.createElement('div');
    addBtn.className = 'tree-add';
    addBtn.style.display = canAddChild ? '' : 'none';
    addBtn.title = 'Add child equipment';
    addBtn.innerHTML = I.plus;

    // Tooltip - shows on hover via CSS, contains full label + serial
    const tt = document.createElement('div');
    tt.className = 'tt';
    const snLine = nd.serial
      ? `<div style="color:#c4b5fd;font-family:monospace;font-size:10px;margin-top:2px">&#9636; ${nd.serial}</div>`
      : (SERIAL_REQUIRED_TYPES.has(nd.type) ? `<div style="color:#fca5a5;font-size:10px;margin-top:2px">⚠ No serial assigned</div>` : '');
    const statusLine = nd.status==='fault'
      ? `<div style="color:#fca5a5;font-size:10px;margin-top:2px">● FAULT</div>`
      : nd.status==='warn'
      ? `<div style="color:#fde047;font-size:10px;margin-top:2px">● Warning</div>`
      : `<div style="color:#86efac;font-size:10px;margin-top:2px">● Operational</div>`;
    tt.innerHTML = `<div style="font-weight:600;margin-bottom:2px">${nd.label}</div><div style="color:#94a3b8;font-size:10px">${nd.sub}</div>${snLine}${statusLine}`;

    row.append(toggle, icon, label, dot, addBtn, tt);
    wrap.appendChild(row);

    if(hasChildren){
      const childWrap = document.createElement('div');
      childWrap.className = `tree-children${isExpanded?' open':''}`;
      renderNodes(nd.children, childWrap, depth+1);
      wrap.appendChild(childWrap);
      toggle.addEventListener('click', e => {
        e.stopPropagation();
        expanded.has(nd.id)?expanded.delete(nd.id):expanded.add(nd.id);
        renderTree();
      });
    }
    row.addEventListener('click', () => selectNode(nd));
    addBtn.addEventListener('click', e => { e.stopPropagation(); openAddChildModal(nd); });
    container.appendChild(wrap);
  });
}

function updateAssetCount(){
  let count = 0;
  function walk(n){ count++; (n.children||[]).forEach(walk); }
  walk(PLANTS[currentPlant].tree);
  const el = document.getElementById('hdr-assets');
  if(el) el.textContent = count;
}

function selectNode(nd){
  selectedId = nd.id;
  activeTab = 'overview';
  historyPage = 1; // Reset history pagination when selecting a new node
  renderTree();
  
  if(mapViewActive){
    // In map view mode, highlight the marker on the map
    if(geoMap && nd.geo && nd.geo.lat && nd.geo.lng){
      // Pan to the marker
      geoMap.setView([nd.geo.lat, nd.geo.lng], 18, {animate: true});
      
      // Open popup for the marker
      geoMarkers.forEach(marker => {
        const pos = marker.getLatLng();
        if(Math.abs(pos.lat - nd.geo.lat) < 0.00001 && Math.abs(pos.lng - nd.geo.lng) < 0.00001){
          marker.openPopup();
        }
      });
    }
  } else {
    // Normal mode - render main and detail
    renderMain(nd);
    renderDetail(nd);
  }
}

function buildSparkline(data,color){
  const w=300,h=52,mn=Math.min(...data),mx=Math.max(...data);
  const pts=data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/(mx-mn+.001))*h}`).join(' ');
  const area=`0,${h} ${pts} ${w},${h}`;
  const gid='g'+Math.random().toString(36).slice(2);
  return `<svg class="spark-svg" viewBox="0 0 ${w} ${h}" style="height:52px;margin-top:6px">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <polygon points="${area}" fill="url(#${gid})"/>
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

let addChildParentId = null;

window.openAddChildModal_byId = id => {

function openAddChildModal(parentNd){
  addChildParentId = parentNd.id;
  addChildSelectedType = null;

function renderAddChildModal(parentNd){

  document.getElementById('modal-icon').innerHTML = `<div style="background:#ede9fe;color:#7c3aed">${I.plus}</div>`;
  document.getElementById('modal-icon').firstChild.style.cssText='width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center';

  document.getElementById('modal-title').textContent = `Add equipment to ${parentNd.label}`;
  document.getElementById('modal-sub').textContent = addChildStep===1

    : 'Enter the details for the new equipment.';

  if(addChildStep===1){
    const opts = allowed.map(t=>`
      <div class="ct-option${addChildSelectedType===t.type?' selected':''}" onclick="selectChildType('${t.type}')">
        <div class="ct-icon ${t.bg}">${I[t.icon]||I.panel}</div>
        <div><div class="ct-name">${t.label}</div><div class="ct-level">${t.level}</div></div>
      </div>`).join('');

        <div class="step active">1 · Choose type</div>
        <div class="step">2 · Enter details</div>
      </div>
      <div class="child-type-grid">${opts}</div>

      <button class="mbtn mbtn-cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn mbtn-purple" onclick="goToAddChildStep2()" id="next-btn" ${!addChildSelectedType?'disabled style="opacity:.5"':''}>Next →</button>
    `;
  } else {
    const typeDef = allowed.find(t=>t.type===addChildSelectedType);
    const snRequired = typeDef && typeDef.serialRequired;
    document.getElementById('modal-body').innerHTML = `
      <div class="step-row">
        <div class="step done">1 · Choose type</div>
        <div class="step active">2 · Enter details</div>
      </div>

        <input id="add-name" type="text" placeholder="e.g. Inverter 2.3"/>
      </div>

        <input id="add-serial" type="text" placeholder="${snRequired?'Required for this equipment type - e.g. SN-99001':'e.g. STR-001 (optional)'}"/>
        ${snRequired?'<div class="sn-required">⚠ Serial number is required for physical equipment (switchgear, transformers, inverters, combiners)</div>':'<div class="hint">Serial number is optional for strings and panels</div>'}
      </div>
      <div class="mf">
        <label>Output capacity</label>
        <input id="add-output" type="text" placeholder="e.g. 350 kW"/>
      </div>
      ${addChildSelectedType==='inv'?`<div class="mf">
        <label>Inverter type</label>
        <select id="add-invtype"><option value="String">String</option><option value="Pool">Pool</option><option value="Central">Central</option></select>
      </div>`:''}
      <div class="mf">
        <label>Notes</label>
        <input id="add-notes" type="text" placeholder="Optional description"/>
      </div>
    `;
    document.getElementById('modal-actions').innerHTML = `
      <button class="mbtn mbtn-cancel" onclick="closeModal()">Cancel</button>
      <button class="mbtn mbtn-cancel" onclick="backToStep1()">← Back</button>
      <button class="mbtn mbtn-purple" onclick="confirmAddChild()">Add equipment</button>

window.selectChildType = type => {
  addChildSelectedType = type;
  const parentNd = findNode(PLANTS[currentPlant].tree, addChildParentId);
  renderAddChildModal(parentNd);
};

function goToAddChildStep2(){
  if(!addChildSelectedType) return;
  addChildStep = 2;
  const parentNd = findNode(PLANTS[currentPlant].tree, addChildParentId);
  renderAddChildModal(parentNd);
}

function backToStep1(){
  addChildStep = 1;
  const parentNd = findNode(PLANTS[currentPlant].tree, addChildParentId);
  renderAddChildModal(parentNd);
}

function confirmAddChild(){
  const parentNd = findNode(PLANTS[currentPlant].tree, addChildParentId);
  if(!parentNd) return;
  const typeDef = (CHILD_TYPES[parentNd.type]||[]).find(t=>t.type===addChildSelectedType);
  if(!typeDef) return;

  const nameEl = document.getElementById('add-name');
  const snEl = document.getElementById('add-serial');
  const outputEl = document.getElementById('add-output');
  const invTypeEl = document.getElementById('add-invtype');

  const name = nameEl&&nameEl.value.trim()||typeDef.label+' (new)';
  const serial = snEl&&snEl.value.trim()||null;
  const output = outputEl&&outputEl.value.trim()||null;
  const invType = invTypeEl?invTypeEl.value:null;

  if(typeDef.serialRequired && !serial){
    if(snEl) { snEl.style.borderColor='#dc2626'; snEl.focus(); }
    showToast('Serial number is required for '+typeDef.label,'fault');
    return;
  }

  const newNode = node(
    mkId(), addChildSelectedType, name,
    serial?serial:'New '+typeDef.label,
    typeDef.icon, typeDef.bg, 'ok',
    serial||null, output||null, invType,
    serial?[{k:'Serial',v:serial}]:[],
    []
  );

  parentNd.children = parentNd.children || [];
  parentNd.children.push(newNode);
  expanded.add(parentNd.id);
  expanded.add(newNode.id);

  closeModal();
  renderTree();
  selectNode(newNode);
  showToast(`${name} added successfully`+(serial?` (SN: ${serial})`:''),'purple');
}

function showToast(msg,type='ok'){
  const wrap=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className=`toast t-${type}`;
  const ico={ok:I.check,warn:I.alert,fault:I.alert,purple:I.serial};
  const col={ok:'var(--ok)',warn:'var(--warn)',fault:'var(--fault)',purple:'var(--purple)'};
  t.innerHTML=`<span style="color:${col[type]||col.ok}">${ico[type]||I.check}</span><span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{t.style.cssText='opacity:0;transform:translateY(10px);transition:.3s';setTimeout(()=>t.remove(),300);},3200);
}

// HISTORY TAB (maintenance + replace combined with pagination)
// ═══════════════════════════════════════
let historyPage = 1;
const historyPerPage = 5;

function buildHistoryTab(nd){
  // Combine all history into one unified array
  const allHistory = [];
  
  // Add maintenance records
  getMaintenanceFor(nd).forEach(m => {
    allHistory.push({
      date: m.date,
      title: m.title,
      sub: m.sub,
      badge: m.type,
      badgeBg: m.bc,
      badgeColor: m.tc,
      category: 'Maintenance'
    });
  });
  
  // Add replacement records
  getReplaceHist(nd).forEach(r => {
    if(r.type !== 'none'){
      allHistory.push({
        date: r.date,
        title: r.title,
        sub: r.by,
        badge: r.type === 'installed' ? 'Installed' : 'Replaced',
        badgeBg: r.type === 'installed' ? '#dcfce7' : '#fee2e2',
        badgeColor: r.type === 'installed' ? '#166534' : '#991b1b',
        category: 'Serial'
      });
    }
  });
  
  // Sort by date (newest first)
  // Note: This is a simple sort for demo, real dates should be parsed properly
  allHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
  
  const totalPages = Math.ceil(allHistory.length / historyPerPage);
  const startIdx = (historyPage - 1) * historyPerPage;
  const endIdx = startIdx + historyPerPage;
  const pageHistory = allHistory.slice(startIdx, endIdx);
  
  const histHtml = pageHistory.map(h => `
    <div class="hist-row">
      <div class="hist-date">${h.date}</div>
      <div class="hist-body">
        <div class="hist-title">${h.title}</div>
        <div class="hist-sub">${h.sub}</div>
      </div>
      <span class="hist-badge" style="background:${h.badgeBg};color:${h.badgeColor}" title="${h.category}">${h.badge}</span>
    </div>`).join('');
  
  const paginationHtml = totalPages > 1 ? `
    <div class="hist-pagination">
      <div class="hist-page-info">Showing ${startIdx + 1}-${Math.min(endIdx, allHistory.length)} of ${allHistory.length} records</div>
      <div class="hist-page-btns">
        <button class="hist-page-btn" ${historyPage === 1 ? 'disabled' : ''} onclick="changeHistoryPage(${historyPage - 1})">&larr; Prev</button>
        ${Array.from({length: totalPages}, (_, i) => i + 1).map(p => `
          <button class="hist-page-btn ${p === historyPage ? 'active' : ''}" onclick="changeHistoryPage(${p})">${p}</button>
        `).join('')}
        <button class="hist-page-btn" ${historyPage === totalPages ? 'disabled' : ''} onclick="changeHistoryPage(${historyPage + 1})">Next &rarr;</button>
      </div>
    </div>` : '';
  
  return `
    <div class="hist-section-head">${I.wrench} Activity History</div>
    ${histHtml || '<div style="padding:20px;text-align:center;color:#94a3b8;font-size:11px">No history records found</div>'}
    ${paginationHtml}`;
}

function changeHistoryPage(page){
  historyPage = page;
  const n = findNode(PLANTS[currentPlant].tree, selectedId);
  if(n) selectNode(n);
}

    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      ${statusCounts.ok > 0 ? `<span style="font-size:11px;display:flex;align-items:center;gap:5px;padding:4px 10px;background:#dcfce7;border-radius:6px;color:#166534;font-weight:500">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--ok)"></span>${statusCounts.ok} Operational
      </span>` : ''}
      ${statusCounts.warn > 0 ? `<span style="font-size:11px;display:flex;align-items:center;gap:5px;padding:4px 10px;background:#fef9c3;border-radius:6px;color:#92400e;font-weight:500">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--warn)"></span>${statusCounts.warn} Warning
      </span>` : ''}
      ${statusCounts.fault > 0 ? `<span style="font-size:11px;display:flex;align-items:center;gap:5px;padding:4px 10px;background:#fee2e2;border-radius:6px;color:#991b1b;font-weight:500">
        <span style="width:7px;height:7px;border-radius:50%;background:var(--fault)"></span>${statusCounts.fault} Fault
      </span>` : ''}
    </div>
    <div class="map-wrap" id="map-container">
      <div id="real-map"></div>
      <div class="geo-map-stats">
        <div class="geo-map-stats-title">📍 Ash, Canterbury CT3 2DA</div>
        <div style="font-size:10px;color:#64748b;margin-top:4px">
          Real-time GPS tracking
        </div>
      </div>
    </div>`;
}

// ── Leaflet Map Engine ──
function initMap(nd){
  const mapDiv = document.getElementById('real-map');
  if(!mapDiv) {
    console.error('Map container not found');
    return;
  }
  
  if(typeof L === 'undefined') {
    console.error('Leaflet library not loaded');
    return;
  }
  
  const allNodes=[];
  function walkGeo(n){ if(n.geo) allNodes.push(n); (n.children||[]).forEach(walkGeo); }
  walkGeo(PLANTS[currentPlant].tree);
  if(!allNodes.length) {
    console.warn('No geo nodes found');
    return;
  }

  // Clear existing map
  if(geoMap) {
    geoMap.remove();
    geoMarkers = [];
  }

  try {
    // Initialize Leaflet map at Ash, Canterbury coordinates
    geoMap = L.map('real-map').setView([51.28407158927984, 1.3179885204006434], 16);

    // Define tile layers
    mapLayers.street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19
    });

    mapLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: '© Esri',
      maxZoom: 19
    });

    // Add default layer (satellite)
    mapLayers.satellite.addTo(geoMap);
    currentMapLayer = 'satellite';

    // Add geofence boundary
    addGeofence();

    // Add equipment markers
    addGeoEquipmentMarkers(allNodes, nd);
    
    console.log('Map initialized successfully with', allNodes.length, 'nodes');
  } catch(error) {
    console.error('Error initializing map:', error);
  }
}

function addGeofence(){
  if(!geoMap) return;
  
  // Geofence boundary for Ash Solar Farm
  const plantGeofence = [
    [51.28557111179551, 1.314837116177057],
    [51.28429431672192, 1.3131401947229795],
    [51.28308132852434, 1.315219880414819],
    [51.28425441630394, 1.316585072862836],
    [51.28557111179551, 1.314837116177057]
  ];

  const geofencePolygon = L.polygon(plantGeofence, {
    color: '#FF6B00',
    fillColor: '#FF6B00',
    fillOpacity: 0.08,
    weight: 4,
    dashArray: '10, 5'
  }).addTo(geoMap);

  geofencePolygon.bindPopup(`
    <div class="geo-popup">
      <div class="geo-popup-title">Ash Solar Farm Boundary</div>
      <div class="geo-popup-sub">Canterbury CT3 2DA, UK</div>
      <div class="geo-popup-row">
        <span class="geo-popup-k">Total Capacity</span>
        <span class="geo-popup-v">2.8 MW</span>
      </div>
      <div class="geo-popup-row">
        <span class="geo-popup-k">Area</span>
        <span class="geo-popup-v">~15,000 m²</span>
      </div>
    </div>
  `);
}

function addGeoEquipmentMarkers(allNodes, currentNode){
  if(!geoMap) return;

  allNodes.forEach(n => {
    if(!n.geo || !n.geo.lat || !n.geo.lng) return;

    const statusClass = n.status === 'ok' ? 'marker-ok' : 
                       n.status === 'warn' ? 'marker-warn' : 'marker-fault';
    const statusColor = n.status === 'ok' ? '#16a34a' : 
                       n.status === 'warn' ? '#ca8a04' : '#dc2626';

    const iconHtml = `
      <div class="custom-marker ${statusClass}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
          <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z"/>
        </svg>
      </div>
    `;

    const customIcon = L.divIcon({
      html: iconHtml,
      className: 'custom-marker-wrapper',
      iconSize: [32, 32],
      iconAnchor: [16, 16],
      popupAnchor: [0, -16]
    });

    const marker = L.marker([n.geo.lat, n.geo.lng], { icon: customIcon });

    const statusText = n.status === 'ok' ? 'Operational' : 
                      n.status === 'warn' ? 'Warning' : 'Fault';

    marker.bindPopup(`
      <div class="geo-popup">
        <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 6px;">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: ${statusColor};"></div>
          <div class="geo-popup-title">${n.label}</div>
        </div>
        <div class="geo-popup-sub">${n.sub || n.type}</div>
        ${n.serial ? `<div class="geo-popup-row">
          <span class="geo-popup-k">Serial</span>
          <span class="geo-popup-v" style="font-family:monospace;font-size:10px">${n.serial}</span>
        </div>` : ''}
        <div class="geo-popup-row">
          <span class="geo-popup-k">Status</span>
          <span class="geo-popup-v" style="color: ${statusColor};">${statusText}</span>
        </div>
        ${n.output ? `<div class="geo-popup-row">
          <span class="geo-popup-k">Output</span>
          <span class="geo-popup-v">${n.output}</span>
        </div>` : ''}
        <div class="geo-popup-row">
          <span class="geo-popup-k">GPS</span>
          <span class="geo-popup-v" style="font-size: 10px; font-family: monospace;">
            ${n.geo.lat.toFixed(6)}, ${n.geo.lng.toFixed(6)}
          </span>
        </div>
        <button class="geo-popup-btn" onclick="selectById('${n.id}')">
          View Full Details →
        </button>
      </div>
    `);

    marker.addTo(geoMap);
    geoMarkers.push(marker);
  });

  // Fit bounds to show all markers
  if(geoMarkers.length > 0){
    const group = L.featureGroup(geoMarkers);
    geoMap.fitBounds(group.getBounds().pad(0.1));
  }
}

function switchGeoMapLayer(layerType){
  if(!geoMap) return;

  // Remove all tile layers
  geoMap.eachLayer(layer => {
    if(layer instanceof L.TileLayer) {
      geoMap.removeLayer(layer);
    }
  });

  // Add new layer
  if(layerType === 'hybrid') {
    mapLayers.satellite.addTo(geoMap);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
      opacity: 0.3
    }).addTo(geoMap);
  } else {
    mapLayers[layerType].addTo(geoMap);
  }

  currentMapLayer = layerType;

  // Update button states
  document.querySelectorAll('.map-layer-btn').forEach(btn => {
    btn.classList.remove('active');
    if((layerType === 'street' && btn.textContent.includes('Street')) ||
       (layerType === 'satellite' && btn.textContent.includes('Satellite')) ||
       (layerType === 'hybrid' && btn.textContent.includes('Hybrid'))) {
      btn.classList.add('active');
    }
  });
}

function fitAllGeoMarkers(){
  if(!geoMap || geoMarkers.length === 0) return;
  const group = L.featureGroup(geoMarkers);
  geoMap.fitBounds(group.getBounds().pad(0.1));
}

// Make functions globally accessible
window.switchGeoMapLayer = switchGeoMapLayer;
window.fitAllGeoMarkers = fitAllGeoMarkers;

// ═══════════════════════════════════════
// HELPERS / DATA
// ═══════════════════════════════════════
function getTrail(root,targetId,trail=[]){
  trail.push(root);
  if(root.id===targetId) return trail;
  for(const c of (root.children||[])){const r=getTrail(c,targetId,[...trail]);if(r) return r;}
  return null;
}
function findNode(root,id){
  if(root.id===id) return root;
  for(const c of (root.children||[])){const r=findNode(c,id);if(r) return r;}
  return null;
}
function countDesc(nd){let c=0;(nd.children||[]).forEach(n=>{c+=1+countDesc(n);});return c;}

function getActivityFor(nd){
  const base=[
    {icon:`<span style="color:var(--ok)">${I.check}</span>`,ibg:'#dcfce7',text:`<strong>${nd.label}</strong> telemetry synced`,time:'8s ago',by:'System'},

  if(nd.status==='warn') base.unshift({icon:`<span style="color:var(--warn)">${I.alert}</span>`,ibg:'#fef9c3',text:`<strong>Warning</strong> - over-temp on ${nd.label}`,time:'12m ago',by:'System'});

}
